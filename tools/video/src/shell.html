<title>Easy Reader Video Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/*FONTS*/
/* Layout: a screening room. The 9:16 video stands on the left; its settings and the reel of 100 sit beside it. */
:root {
  color-scheme: dark;
  --bg: #0E1726; --panel: #162235; --line: #2A3950; --text: #F5EFE6; --muted: #A9B2C0;
  --rose: #F7A8B8; --mint: #A9E5C3; --butter: #F6EE9B; --ink: #0E1726;
  --display: "ER Lexend", "Inter ER", system-ui, sans-serif;
  --body: "Inter ER", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 var(--body); }
body.render { overflow: hidden; }
body.render .app > :not(.screen), body.render .transport, body.render header { display: none; }
body.render .app, body.render .screen, body.render #stage { display: block; padding: 0; margin: 0; max-width: none; }
body.render canvas { width: auto; height: auto; border-radius: 0; display: block; }
.app { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); gap: 28px; max-width: 1180px; margin: 0 auto; box-sizing: border-box; height: 100%;
  padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.screen { display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; }
#stage { flex: 1; min-height: 0; display: flex; justify-content: center; }
canvas { height: 100%; max-height: calc(100vh - 110px); aspect-ratio: 9 / 16; max-width: 100%; border-radius: 14px; background: #0b1220; display: block; }
.transport { display: flex; align-items: center; gap: 10px; }
button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--butter); outline-offset: 2px; }
#play { background: var(--rose); color: var(--ink); border-color: var(--rose); font-weight: 600; min-width: 74px; }
#scrub { flex: 1; min-width: 0; accent-color: var(--rose); }
#clock { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.side { display: flex; flex-direction: column; gap: 16px; min-width: 0; min-height: 0; }
header h1 { font: 600 22px/1.2 var(--display); margin: 0; text-wrap: balance; }
header p { margin: 4px 0 0; color: var(--muted); max-width: 60ch; }
.now h2 { font: 600 17px/1.3 var(--display); margin: 0 0 8px; }
.tagrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#tag { font: 12px/1.4 var(--mono); color: var(--butter); overflow-wrap: anywhere; min-width: 0; }
#prompt { margin: 12px 0 0; padding: 10px 12px; background: var(--panel); border-radius: 8px; color: var(--muted); font-size: 13px; max-height: 9.5em; overflow-y: auto; }
#recipe { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 16px; margin: 12px 0 0; }
#recipe div { min-width: 0; border-top: 1px solid var(--line); padding-top: 6px; }
#recipe dt { font-size: 11px; color: var(--muted); letter-spacing: 0.02em; }
#recipe dd { margin: 0; font-weight: 600; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
#types { display: flex; gap: 6px; flex-wrap: wrap; }
#types button { padding: 4px 10px; border-radius: 999px; font-size: 13px; }
#types button[aria-pressed="true"] { background: var(--mint); color: var(--ink); border-color: var(--mint); font-weight: 600; }
#search { flex: 1; min-width: 120px; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
#count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
#list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; min-height: 180px; border-top: 1px solid var(--line); }
#list button { display: flex; gap: 12px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 8px 6px; }
#list button:hover { background: var(--panel); }
#list li[aria-current="true"] button { background: var(--panel); box-shadow: inset 3px 0 0 var(--rose); }
.num { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.what { min-width: 0; display: flex; flex-direction: column; }
.what b { font-weight: 600; overflow-wrap: anywhere; }
.what i { font-style: normal; font-size: 12px; color: var(--muted); }
@media (max-width: 760px) {
  html, body { height: auto; }
  .app { grid-template-columns: minmax(0, 1fr); height: auto; }
  canvas { height: auto; width: min(100%, 340px); max-height: none; }
  #list { max-height: 60vh; }
}
</style>
<div class="app">
  <section class="screen" aria-label="Preview">
    <div id="stage"></div>
    <div class="transport">
      <button type="button" id="prev" aria-label="Previous video">&#8249;</button>
      <button type="button" id="play">Pause</button>
      <button type="button" id="next" aria-label="Next video">&#8250;</button>
      <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Position in video">
      <span id="clock">0:00 / 0:00</span>
    </div>
  </section>
  <section class="side">
    <header>
      <h1>Easy Reader Video Lab</h1>
      <p>One Three.js script, 100 videos. Each teaches something about words, turns hard to read, then changes into a reading font. Every setting below is tagged so the results can be compared later.</p>
    </header>
    <div class="now">
      <h2 id="title"></h2>
      <div class="tagrow"><code id="tag"></code><button type="button" id="copy">Copy tag</button></div>
      <p id="prompt" hidden></p>
      <dl id="recipe"></dl>
    </div>
    <div class="filters">
      <div id="types" role="group" aria-label="Filter by what is taught">
        <button type="button" data-type="all" aria-pressed="true">All</button>
        <button type="button" data-type="variety" aria-pressed="false">5 varieties</button>
        <button type="button" data-type="word" aria-pressed="false">Words</button>
        <button type="button" data-type="origin" aria-pressed="false">Origins</button>
        <button type="button" data-type="quote" aria-pressed="false">Quotes</button>
        <button type="button" data-type="fact" aria-pressed="false">Facts</button>
        <button type="button" data-type="phrase" aria-pressed="false">Phrases</button>
      </div>
      <input type="search" id="search" placeholder="Search, e.g. OpenDyslexic or scatter" aria-label="Search videos">
      <span id="count"></span>
    </div>
    <ul id="list"></ul>
  </section>
</div>
/*SCRIPTS*/
