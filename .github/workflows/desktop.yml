# Builds installers for Windows, Mac and Linux, and a test app for Android. Download them from the run's "Artifacts" section.
name: Apps
on:
  workflow_dispatch:
  pull_request:
  push: { tags: ['v*'] }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux, args: '' }
          - { os: windows-latest, name: windows, args: '' }
          - { os: macos-latest, name: mac, args: '--target universal-apple-darwin' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.name == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}" }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: apps/reader/src-tauri }
      - if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/reader
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: easy-reader-${{ matrix.name }}
          path: |
            apps/reader/src-tauri/target/**/release/bundle/**/*.deb
            apps/reader/src-tauri/target/**/release/bundle/**/*.rpm
            apps/reader/src-tauri/target/**/release/bundle/**/*.AppImage
            apps/reader/src-tauri/target/**/release/bundle/**/*.msi
            apps/reader/src-tauri/target/**/release/bundle/**/*.exe
            apps/reader/src-tauri/target/**/release/bundle/**/*.dmg
          if-no-files-found: warn

  # A test build for Android phones (signed with a throwaway debug key, so it installs only by sideloading).
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android' }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: apps/reader/src-tauri }
      - run: npm ci
      - name: Build the Android app
        working-directory: apps/reader
        run: |
          # The runner image ships an NDK; ANDROID_NDK_LATEST_HOME is a shell variable, not a workflow one
          export NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)}"
          echo "Using NDK at $NDK_HOME"
          npx tauri android init --ci
          npx tauri android build --ci --debug --apk --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: easy-reader-android
          path: apps/reader/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
