name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm -w @dr/reader run build:single
      - uses: actions/upload-artifact@v4
        with: { name: browser-extension, path: apps/extension/dist }
      - uses: actions/upload-artifact@v4
        with: { name: easy-reader-single-file, path: apps/reader/dist-single/index.html }
